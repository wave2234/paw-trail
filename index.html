if(t!=='dark'&&t!=='light')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t)})();</script>
<style>
/* 共游 · Paw Trail 试玩页。纯前端，示例数据是编的（杭州西湖），写下的纸条和游记只留在这一页。
   出发封面(滑动出发) -> 暖色矢量地图(MapLibre + OpenFreeMap) -> 站点气泡(地点 / 留痕) -> 底部上拉抽屉 -> 分天时间轴攻略 -> 旅行本(游记 / 归档)。图标全是线条 SVG。 */
:root{
  --bg:#F7F1E6;--paper:#FFFAF2;--paper2:#F2E8D8;--ink:#2C2118;--ink2:#7A6857;--line:rgba(44,33,24,.10);--line2:rgba(44,33,24,.18);
  --accent:#DA7756;--accent-d:#BF5A36;--accent-t:#B4532E;--axis:rgba(191,90,54,.42);--ok:#3A8F5C;--me:#3B82F6;
  --glass:rgba(255,250,242,.92);--sh1:0 2px 10px rgba(70,40,15,.10);--sh2:0 18px 50px rgba(60,32,10,.30),0 2px 10px rgba(60,32,10,.12);
  --sat:var(--shell-inset-top, env(safe-area-inset-top));--sab:var(--shell-inset-bottom, env(safe-area-inset-bottom));
  --topoff:calc(var(--sat) + 10px);--peek:calc(226px + var(--sab));
}
html[data-theme="dark"]{
  --bg:#1B1815;--paper:#26221D;--paper2:#312B24;--ink:#EFE6D8;--ink2:#A99B89;--line:rgba(255,245,230,.10);--line2:rgba(255,245,230,.20);
  --accent:#E08A5B;--accent-d:#C96442;--accent-t:#F0A27A;--axis:rgba(224,138,91,.45);--ok:#5DB380;
  --glass:rgba(38,34,29,.92);--sh1:0 2px 10px rgba(0,0,0,.35);--sh2:0 18px 50px rgba(0,0,0,.55);color-scheme:dark
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font:14px/1.55 -apple-system,system-ui,'PingFang SC','HarmonyOS Sans SC','MiSans',sans-serif;color:var(--ink);background:var(--bg);overflow:hidden;height:100dvh;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
a{color:inherit}
::selection{background:color-mix(in srgb,var(--accent) 30%,transparent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:20px;height:20px;flex:none;display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ic.f{fill:currentColor;stroke:none}
.ic.s{width:14px;height:14px}

#map{position:fixed;inset:0;background:var(--paper2);z-index:1}
.maplibregl-ctrl-bottom-left{bottom:calc(var(--peek) + 2px);left:2px;z-index:2}
.maplibregl-ctrl-attrib{font-size:11px;background:var(--glass)!important;color:var(--ink2)}
.maplibregl-ctrl-attrib a{color:var(--ink2)}
.maplibregl-ctrl-attrib.maplibregl-compact:not(.maplibregl-compact-show){opacity:.55}
.maplibregl-popup-content{background:var(--paper);color:var(--ink);border-radius:18px;padding:13px 34px 13px 15px;box-shadow:var(--sh2);font:14px/1.55 inherit;border:1px solid var(--line)}
.maplibregl-popup-content b{font-size:16px;font-weight:600;display:block;line-height:1.35}
.maplibregl-popup-content p{margin-top:4px}
.maplibregl-popup-content small{display:block;margin-top:5px;font-size:12px;color:var(--ink2)}
.maplibregl-popup-close-button{width:30px;height:30px;font-size:19px;color:var(--ink2);right:3px;top:3px;border-radius:50%}
.maplibregl-popup-anchor-bottom .maplibregl-popup-tip,.maplibregl-popup-anchor-bottom-left .maplibregl-popup-tip,.maplibregl-popup-anchor-bottom-right .maplibregl-popup-tip{border-top-color:var(--paper)}
.maplibregl-popup-anchor-top .maplibregl-popup-tip,.maplibregl-popup-anchor-top-left .maplibregl-popup-tip,.maplibregl-popup-anchor-top-right .maplibregl-popup-tip{border-bottom-color:var(--paper)}
.maplibregl-popup-anchor-left .maplibregl-popup-tip{border-right-color:var(--paper)}
.maplibregl-popup-anchor-right .maplibregl-popup-tip{border-left-color:var(--paper)}
.mkw{width:32px;height:32px;cursor:pointer}
.mk{font-style:normal;width:32px;height:32px;border-radius:50%;background:var(--accent-d);color:#fff;font-size:14px;font-weight:700;display:grid;place-items:center;border:2.5px solid var(--paper);box-shadow:0 3px 8px rgba(70,35,10,.34);cursor:pointer;transition:scale .28s cubic-bezier(.2,1.5,.4,1)}
.mkw.on .mk{scale:1.2}
.mk.v{background:var(--ok)}
.mk .ic{width:16px;height:16px;stroke-width:2.4}
.mkme{width:16px;height:16px;border-radius:50%;background:var(--me);border:3px solid #fff;box-shadow:0 0 0 1px rgba(59,130,246,.35),0 2px 6px rgba(0,0,0,.25)}

/* 顶上一排 */
.top{position:fixed;left:12px;right:12px;top:var(--topoff);z-index:35;display:flex;gap:8px;pointer-events:none}
.top>*{pointer-events:auto}
.seg{flex:none;height:44px;display:flex;padding:4px;border-radius:22px;background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:var(--sh1)}
.seg a{display:grid;place-items:center;padding:0 14px;border-radius:18px;font-size:14px;font-weight:600;color:var(--ink2);text-decoration:none;white-space:nowrap}
.seg a.on{background:var(--accent-d);color:#fff}
/* 左上角「教程 ↗」: 一个实心圆角按钮带斜箭头, 一看就知道能点进去 */
.tutb{flex:none;height:44px;display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:0 16px;border-radius:22px;background:var(--accent-d);color:#fff;font-size:15px;font-weight:600;line-height:1;letter-spacing:0;text-decoration:none;white-space:nowrap;box-shadow:0 6px 16px -6px rgba(150,70,30,.55);-webkit-tap-highlight-color:transparent;transition:transform .15s}
.tutb span{display:block;line-height:1}
.tutb svg{display:block;flex:none;width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.tutb:active{transform:scale(.95)}
.ttl{flex:1;min-width:0;height:44px;padding:0 16px;border-radius:22px;background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:var(--sh1);display:flex;flex-direction:column;justify-content:center;text-align:left;transition:opacity .3s,transform .3s}
.ttl b{font-size:14px;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ttl span{font-size:12px;line-height:1.25;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body:not(.in) .ttl{opacity:0;transform:translateY(-6px);pointer-events:none}
.tools{position:fixed;right:12px;top:calc(var(--topoff) + 54px);z-index:19;display:flex;flex-direction:column;gap:8px;align-items:flex-end;transition:opacity .3s}
body:not(.in) .tools{opacity:0;pointer-events:none}
.tb{height:42px;min-width:42px;padding:0 14px 0 12px;border-radius:21px;background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:var(--sh1);display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;transition:scale .25s cubic-bezier(.2,1.6,.4,1)}
.tb.ico{padding:0;width:42px;justify-content:center}
.tb:active{scale:.94}
.tb .ic{color:var(--accent-t)}

/* 出发封面 */
#cover{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;transition:transform .7s cubic-bezier(.7,0,.16,1);will-change:transform}
body.in #cover{transform:translateY(-103%);pointer-events:none}
body.jump #cover,body.jump #drawer,body.jump .ttl{transition:none}
.cvp{position:relative;flex:1 1 0;min-height:0;overflow:hidden;border-radius:0 0 36px 36px;background:var(--paper2)}
.cvp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s}
.cvp img.on{opacity:1}
.cvp.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(30,18,8,.30),rgba(30,18,8,0) 24%,rgba(30,18,8,0) 78%,rgba(30,18,8,.30));pointer-events:none}
.cvp.card img{inset:auto;left:11%;top:50%;width:78%;height:auto;aspect-ratio:4/3;transform:translateY(-44%) rotate(-2.5deg);border-radius:20px;border:7px solid var(--paper);box-shadow:0 16px 36px rgba(80,40,10,.24)}
.cvp .paws{position:absolute;inset:0;color:var(--accent);display:none}
.cvp.none .paws,.cvp.card .paws{display:block}
.cvp.card .paws{opacity:.16}
.cvp .paws svg{position:absolute;fill:currentColor}
.cvp .paws svg:nth-child(1){width:46%;left:27%;top:26%;transform:rotate(-12deg)}
.cvp .paws svg:nth-child(2){width:15%;left:10%;top:66%;transform:rotate(-34deg);opacity:.5}
.cvp .paws svg:nth-child(3){width:11%;left:74%;top:14%;transform:rotate(22deg);opacity:.35}
.cvc{position:absolute;left:16px;bottom:12px;z-index:2;font-size:11px;color:rgba(255,250,242,.86);text-shadow:0 1px 3px rgba(0,0,0,.5);display:none}
.cvp.photo .cvc{display:block}
.cvb{flex:none;position:relative;padding:22px 22px calc(var(--sab) + 22px);overflow:hidden}
.cvb .wm{position:absolute;right:-34px;top:-6px;width:170px;height:170px;fill:var(--accent);opacity:.09;transform:rotate(18deg);pointer-events:none}
.cvb h1{position:relative;font-size:30px;line-height:1.22;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.cvb .cvi{position:relative;margin-top:8px;font-size:16px;line-height:1.6;color:var(--ink);opacity:.82;max-width:30em}
.cvb .cvm{position:relative;margin-top:10px;font-size:14px;color:var(--ink2);font-variant-numeric:tabular-nums}
.slide{position:relative;margin-top:22px;height:64px;border-radius:32px;background:var(--paper2);border:1px solid var(--line);overflow:hidden;-webkit-user-select:none;user-select:none}
.slide .fill{position:absolute;left:0;top:0;bottom:0;width:64px;border-radius:32px;background:color-mix(in srgb,var(--accent) 26%,transparent)}
.slide .lbl{position:absolute;inset:0;display:grid;place-items:center;font-size:16px;font-weight:600;letter-spacing:.04em;pointer-events:none}
.slide .chev{position:absolute;right:18px;top:0;bottom:0;display:flex;align-items:center;color:var(--ink2);pointer-events:none}
.slide .chev .ic{width:18px;height:18px;margin-left:-9px;opacity:.3;animation:chv 1.7s ease-in-out infinite}
.slide .chev .ic:nth-child(2){animation-delay:.24s}
@keyframes chv{0%,100%{opacity:.25}50%{opacity:.85}}
.knob{position:absolute;left:6px;top:5px;width:52px;height:52px;font-style:normal;border-radius:50%;background:var(--accent-d);color:#fff;display:grid;place-items:center;box-shadow:0 5px 14px rgba(160,70,30,.38);touch-action:none;cursor:grab}
.knob .ic{width:26px;height:26px}
.slide.hold .knob{scale:1.06;cursor:grabbing}

/* 底部抽屉 */
#drawer{position:fixed;left:0;right:0;bottom:0;z-index:20;max-height:min(78dvh,680px);min-height:calc(var(--peek) + 96px);background:var(--paper);border-radius:28px 28px 0 0;box-shadow:0 -10px 34px rgba(60,35,15,.16);border-top:1px solid var(--line);display:flex;flex-direction:column;transform:translateY(calc(100% - var(--peek)));transition:transform .5s cubic-bezier(.22,1,.3,1);will-change:transform;touch-action:none}
#drawer.open{transform:none}
#drawer.drag{transition:none}
body:not(.in) #drawer{transform:translateY(104%)}
.grab{flex:none;height:22px;display:grid;place-items:center;width:100%}
.grab i{width:38px;height:4.5px;border-radius:3px;background:var(--line2)}
.dhead{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 20px 10px;font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.dhead span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dhead i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--me);margin-right:6px;vertical-align:1px}
.hero{flex:none;position:relative;margin:0 14px;height:150px;border-radius:22px;overflow:hidden;background:var(--paper2);cursor:pointer}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
.hero img.on{opacity:1}
.hero.ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(30,18,8,0) 22%,rgba(30,18,8,.74));pointer-events:none}
.hero .wm{position:absolute;right:-18px;top:-22px;width:150px;height:150px;fill:var(--accent);opacity:.13;transform:rotate(16deg)}
.hero.ph .wm{display:none}
.hc{position:absolute;left:16px;right:104px;bottom:13px;z-index:1}
.hero.ph .hc{color:#FFFAF2;text-shadow:0 1px 6px rgba(0,0,0,.35)}
.hn{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600;line-height:1.3}
.hn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.no{flex:none;width:22px;height:22px;border-radius:50%;background:var(--accent-d);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;text-shadow:none}
.hnote{margin-top:3px;font-size:14px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;opacity:.92}
.hm{margin-top:4px;font-size:12px;opacity:.86;display:flex;gap:10px;align-items:center;font-variant-numeric:tabular-nums}
.hm span{display:inline-flex;align-items:center;gap:3px}
.hm .ic,.sm .ic{color:var(--accent)}
.hero.ph .hm .ic{color:#FFD7A6}
.go{position:absolute;right:13px;bottom:13px;z-index:2;height:40px;padding:0 14px 0 12px;border-radius:20px;background:#FFFAF2;color:#2C2118;display:flex;align-items:center;gap:5px;font-size:14px;font-weight:600;text-decoration:none;box-shadow:0 3px 10px rgba(40,20,5,.22);transition:scale .25s cubic-bezier(.2,1.6,.4,1)}
.go:active{scale:.94}
.go .ic{width:17px;height:17px;color:#B4532E}
.hero:not(.ph) .go{background:var(--accent-d);color:#fff}
.hero:not(.ph) .go .ic{color:#fff}
.sl{list-style:none;flex:0 1 auto;min-height:0;margin:8px 0 0;padding:6px 20px calc(var(--sab) + 18px);overflow:hidden}
#drawer.open .sl{overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.sr{position:relative;display:grid;grid-template-columns:28px 1fr auto;gap:13px;padding:11px 0;cursor:pointer}
.sr::before{content:"";position:absolute;left:13.25px;top:0;bottom:0;border-left:1.5px dashed var(--axis)}
.sr:first-child::before{top:24px}
.sr:last-child::before{bottom:calc(100% - 24px)}
.sr:only-child::before{display:none}
.sn{font-style:normal;position:relative;z-index:1;width:28px;height:28px;border-radius:50%;background:var(--accent-d);color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 4px var(--paper)}
.sn .ic{width:15px;height:15px;stroke-width:2.3}
.sr.v .sn{background:var(--ok)}
.sr.lt .sn{background:var(--paper2);color:var(--accent-t)}
.sb{min-width:0}
.sb b{display:block;font-size:16px;font-weight:600;line-height:1.35}
.sb p{margin-top:2px;font-size:14px;line-height:1.5;opacity:.84}
.sb .rd{margin-top:5px;font-size:14px;color:var(--accent-t)}
.sm{margin-top:4px;font-size:12px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:4px 10px;font-variant-numeric:tabular-nums}
.sm span{display:inline-flex;align-items:center;gap:3px}
.sr.on .sb b{color:var(--accent-t)}
.st{width:60px;height:60px;border-radius:14px;object-fit:cover;background:var(--paper2);opacity:0;transition:opacity .4s}
.st.on{opacity:1}
.empty{padding:26px 26px 0;font-size:14px;line-height:1.75;color:var(--ink2);text-align:center}

/* 攻略卡 */
#gsheet{position:fixed;inset:0;z-index:48;background:rgba(28,18,10,.42);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:calc(var(--sat) + 16px) 14px calc(var(--sab) + 16px)}
#gsheet.on{display:flex;animation:gmaskIn .24s ease-out both}
#gsheet.out{animation:gmaskOut .2s ease-in both}
#gcard{width:100%;max-width:520px;height:min(100%,740px);background:var(--paper);color:var(--ink);border-radius:30px;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--sh2);border:1px solid var(--line)}
#gsheet.on #gcard{animation:gpopIn .6s both}
#gsheet.out #gcard{animation:gpopOut .2s cubic-bezier(.4,0,1,1) both}
@keyframes gmaskIn{from{opacity:0}to{opacity:1}}
@keyframes gmaskOut{from{opacity:1}to{opacity:0}}
@keyframes gpopIn{0%{opacity:0;transform:translateY(26px) scale(.86);animation-timing-function:cubic-bezier(.2,.8,.3,1)}50%{opacity:1;transform:translateY(-5px) scale(1.03,.97);animation-timing-function:cubic-bezier(.45,0,.55,1)}70%{transform:translateY(1px) scale(.986,1.018);animation-timing-function:cubic-bezier(.45,0,.55,1)}86%{transform:scale(1.005,.996)}100%{opacity:1;transform:none}}
@keyframes gpopOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(10px) scale(.93)}}
.gh{flex:none;display:flex;align-items:flex-start;gap:12px;padding:18px 16px 12px 20px}
.gh div{flex:1;min-width:0}
.gh b{display:block;font-size:19px;font-weight:700;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gh small{display:block;margin-top:2px;font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.xb{flex:none;width:36px;height:36px;border-radius:50%;background:var(--paper2);display:grid;place-items:center;color:var(--ink2)}
.xb .ic{width:18px;height:18px}
#gpick{flex:none;display:flex;gap:18px;overflow-x:auto;scrollbar-width:none;padding:0 20px 10px}
#gpick::-webkit-scrollbar,.stk::-webkit-scrollbar,.phs::-webkit-scrollbar{display:none}
#gpick:empty{display:none}
.gp{flex:none;height:30px;font-size:14px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;white-space:nowrap}
.gp.on{color:var(--ink);border-bottom-color:var(--accent)}
/* 黏连分段: 指示块先拉长盖住新旧两格, 再收到新的那格 */
.stk{position:relative;flex:none;display:flex;gap:2px;padding:4px;border-radius:21px;background:var(--paper2);overflow-x:auto;scrollbar-width:none}

/* ---------- 站点气泡(钉在点正上方) ---------- */
let POPOFF=24;
function popAt(ll,html,o){o=o||{};if(!map||!POP)return;POPOFF=o.off==null?24:o.off;
  POP.setOffset(POPOFF);POP.setLngLat(ll).setHTML(html);if(!POP.isOpen())POP.addTo(map);
  const el=POP.getElement();if(!el)return;if(el.querySelector('.pt'))showTab(el,o.tab||'p',false);else clampSlips(el);
  const c=el.querySelector('.maplibregl-popup-content');if(c)c.scrollTop=0;placePop(o)}
function showTab(el,k,anim){const pt=el.querySelector('.pt');if(pt)stickSet(pt,k,anim);el.querySelectorAll('.pv').forEach(v=>{v.hidden=v.dataset.v!==k});clampSlips(el)}
function placePop(o){o=o||{};if(!map||!POP||!POP.isOpen())return;const el=POP.getElement(),c=el&&el.querySelector('.maplibregl-popup-content');if(!c)return;
  const H=innerHeight,hb=document.querySelector('header.top').getBoundingClientRect(),tb=document.querySelector('.tools').getBoundingClientRect(),
    lim=Math.round(hb.bottom)+10,soft=Math.round(tb.bottom)+10,maxY=H-PEEK()-30;
  c.style.maxHeight=Math.max(130,maxY-POPOFF-14-lim)+'px';if(o.move===false){hushSoon();return}const ll=POP.getLngLat();
  if(o.nudge){const top=c.getBoundingClientRect().top;if(top<soft){const py=map.project(ll).y,d=Math.min(soft-top,Math.max(0,maxY-py));if(d>2)map.panBy([0,-Math.round(d)],{duration:300})}hushSoon();return}
  const ph=c.getBoundingClientRect().height+10,y=Math.min(Math.max(soft+ph+POPOFF,H*.4),maxY);
  const q={center:ll,offset:[0,Math.round(y-H/2)],duration:o.fly?700:450};if(o.fly)q.zoom=Math.max(map.getZoom(),15.4);map.easeTo(q);hushSoon()}
/* 气泡高到盖住右边那列按钮时, 按钮先淡出去, 关掉气泡再回来 */
let hushQ=0;
function hushTools(){hushQ=0;const t=document.querySelector('.tools');if(!t)return;let on=false;
  const el=POP&&POP.isOpen()&&POP.getElement(),c=el&&el.querySelector('.maplibregl-popup-content');
  if(c){const a=c.getBoundingClientRect(),b=t.getBoundingClientRect();on=a.right>b.left+4&&a.left<b.right-4&&a.bottom>b.top+4&&a.top<b.bottom-4}
  t.classList.toggle('hush',on)}
function hushSoon(){if(!hushQ)hushQ=requestAnimationFrame(hushTools)}
function clampSlips(root){(root||document).querySelectorAll('.slip').forEach(x=>{if(x.classList.contains('open'))return;const q=x.querySelector('p');if(!q||!q.offsetParent)return;x.classList.toggle('more',q.scrollHeight>q.clientHeight+2)})}
document.addEventListener('click',e=>{const t=e.target;if(!t||!t.closest)return;
  const tb=t.closest('.maplibregl-popup .pt button');if(tb){showTab(tb.closest('.maplibregl-popup'),tb.dataset.k,true);placePop({nudge:true});return}
  const sl=t.closest('.slip.more');if(sl){const op=sl.classList.toggle('open'),m=sl.querySelector('.mo');if(m)m.textContent=op?'收起':'展开';if(sl.closest('.maplibregl-popup'))placePop({nudge:true})}});
document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('.maplibregl-popup-close-button'))markOn(-1)});

/* ---------- 纸条: 你(星星)和 AI(爪印)都能留, 离某一站 150 米内就算这一站的 ---------- */
const WHO={her:{n:'你',ic:'star'},him:{n:'TA',ic:'paw'}};
const NOTES=()=>(ST&&ST.notes)||[],JOURNALS=()=>(ST&&ST.journals)||[];
const fixU=u=>String(u||'').replace(/^http:\/\//,'https://');
const _tzd=ts=>{const x=String(ts||'');if(!/T\d{2}:\d{2}(:\d{2})?(\.\d+)?(Z|[+-]\d{2}:?\d{2})$/.test(x))return null;const d=new Date(x);return isNaN(d)?null:d};
const hmOf=ts=>{const d=_tzd(ts);if(d)return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');const m=String(ts||'').match(/T(\d{2}:\d{2})/);return m?m[1]:''};
const mdOf=ts=>{const d=_tzd(ts);if(d)return String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0');const m=String(ts||'').match(/\d{4}-(\d{2})-(\d{2})/);return m?m[1]+'.'+m[2]:''};
const fullDate=ts=>{const m=String(ts||'').match(/(\d{4})-(\d{2})-(\d{2})/);return m?m[1]+'.'+m[2]+'.'+m[3]:''};
const localISO=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes())};
const paras=t=>String(t||'').split(/\n+/).map(x=>x.trim()).filter(Boolean);
const onTrip=n=>{if(n.lat==null)return false;if(T){if(n.trip)return n.trip===T.id;return (T.stops||[]).some(s=>hav(n.lat,n.lon,s.lat,s.lon)<=5000)}const me=ST&&ST.me;return !me||hav(me.lat,me.lon,n.lat,n.lon)<=30000};
function noteStop(n){const t=T;if(!t||n.lat==null)return -1;let b=-1,bd=1e9;(t.stops||[]).forEach((s,i)=>{const d=hav(n.lat,n.lon,s.lat,s.lon);if(d<bd){bd=d;b=i}});return bd<=150?b:-1}
function notesAt(i){return NOTES().filter(n=>onTrip(n)&&noteStop(n)===i)}
function slipHtml(n,withPlace){const w=WHO[n.by]||WHO.her,ph=(n.photos||[]).filter(Boolean);
  return '<div class="slip '+(n.by==='him'?'him':'her')+'"><i class="who">'+ic(w.ic,'f')+'</i><div><p>'+esc(n.text)+'</p><span class="mo">展开</span>'
    +(ph.length?'<div class="sp">'+ph.map(pic).join('')+'</div>':'')
    +'<small>'+esc([w.n,withPlace?n.place:'',[mdOf(n.at),hmOf(n.at)].filter(Boolean).join(' ')].filter(Boolean).join(' · '))+'</small></div></div>'}
function stopPopHtml(i){const s=T.stops[i],ns=notesAt(i);
  const place='<b>'+esc(s.name)+'</b>'+(s.note?'<p>'+esc(s.note)+'</p>':'')+(s.address?'<small>'+esc(s.address)+'</small>':'');if(!ns.length)return place;
  return '<div class="stk pt"><i class="ind"></i><button data-k="p">地点</button><button data-k="n">留痕<small>'+ns.length+'</small></button></div>'
    +'<div class="pv" data-v="p">'+place+'</div><div class="pv" data-v="n" hidden><div class="slips">'+ns.map(n=>slipHtml(n)).join('')+'</div></div>'}
function badges(i){const who=[...new Set(notesAt(i).map(n=>n.by==='him'?'him':'her'))];
  return who.length?'<span class="bdgs">'+who.map(w=>'<i class="bdg '+w+'">'+ic(WHO[w].ic,'f')+'</i>').join('')+'</span>':''}
function looseNotes(){return NOTES().filter(n=>onTrip(n)&&n.lat!=null&&noteStop(n)<0)}
function looseRows(){const L=looseNotes();if(!L.length)return '';
  return '<li class="sr nt"><i class="sn">'+ic('note')+'</i><div class="sb"><b>路上的纸条</b><div class="slips">'+L.map(n=>slipHtml(n,true)).join('')+'</div></div><i></i></li>'}
function drawLooseMarkers(){if(!map)return;
  looseNotes().forEach(n=>{const w=n.by==='him'?'him':'her',el=document.createElement('div');el.className='mknw';el.innerHTML='<i class="mkn '+w+'">'+ic(WHO[w].ic,'f')+'</i>';
    el.addEventListener('click',e=>{e.stopPropagation();justPicked=Date.now();markOn(-1);popAt([n.lon,n.lat],'<b>'+esc(n.place||'路上')+'</b><div class="slips">'+slipHtml(n)+'</div>',{off:20})});
    MKX.push(new maplibregl.Marker({element:el}).setLngLat([n.lon,n.lat]).addTo(map))})}
let NW=null,NPH=null;
function noteWhere(){const me=ST&&ST.me,t=T;
  if(me&&t&&(t.stops||[]).length){let b=-1,bd=1e9;t.stops.forEach((s,i)=>{const d=hav(me.lat,me.lon,s.lat,s.lon);if(d<bd){bd=d;b=i}});
    if(bd<=150){const s=t.stops[b];return {i:b,lat:s.lat,lon:s.lon,place:s.name,txt:'留在「'+s.name+'」'}}}
  if(me)return {i:-1,lat:me.lat,lon:me.lon,place:me.place||'路上',txt:'留在你现在的位置'+(me.place?'（'+me.place+'）':'')};
  if(t&&t.stops&&t.stops[SEL]){const s=t.stops[SEL];return {i:SEL,lat:s.lat,lon:s.lon,place:s.name,txt:'留在「'+s.name+'」',demo:true}}
  return null}
function openNote(){const w=noteWhere();if(!w){toast('先排一条线，或者等手机报到位置');return}NW=w;NPH=null;
  $('nsW').innerHTML=ic('pin')+esc(w.txt)+(w.demo?'<span>还没拿到你的位置，先放在选中的这一站。</span>':'');
  $('nsX').value='';$('nsF').value='';$('nsI').removeAttribute('src');$('nsI').classList.remove('on');$('ns').classList.add('on');setTimeout(()=>{try{$('nsX').focus()}catch(e){}},300)}
function closeNote(){$('ns').classList.remove('on')}
$('noteBtn').onclick=e=>{e.stopPropagation();openNote()};
$('nsNo').onclick=closeNote;
$('ns').addEventListener('click',e=>{if(e.target===$('ns'))closeNote()});
$('nsF').onchange=e=>{const f=e.target.files&&e.target.files[0];if(!f)return;NPH=URL.createObjectURL(f);$('nsI').src=NPH;$('nsI').classList.add('on')};
$('nsOk').onclick=()=>{const tx=$('nsX').value.trim();if(!tx){toast('写一句话再留');return}if(!ST||!NW)return;
  const n={id:'n'+Date.now(),by:'her',lat:NW.lat,lon:NW.lon,place:NW.place,text:tx,at:localISO(),photos:NPH?[NPH]:[],trip:T&&T.id};
  (ST.notes=ST.notes||[]).push(n);closeNote();drawHero();drawList();drawMarkers();
  if(NW.i>=0)setTimeout(()=>pick(NW.i,{fly:false,tab:'n'}),60);else setTimeout(()=>popAt([n.lon,n.lat],'<b>'+esc(n.place)+'</b><div class="slips">'+slipHtml(n)+'</div>',{off:20}),60);
  toast('试玩里只留在这一页，刷新就没了')};

/* ---------- 旅行本: 游记(一言那样左右滑) + 归档 ---------- */
let BK='j';
function openBook(tab){BK=tab||BK;POP&&POP.remove();$('book').classList.add('on');drawBook();requestAnimationFrame(()=>stickSet($('bkSeg'),BK,false))}
function closeBook(){$('book').classList.remove('on')}
function drawBook(){$('bkJ').classList.toggle('on',BK==='j');$('bkA').classList.toggle('on',BK==='a');$('bkW').style.visibility=BK==='j'?'':'hidden';if(BK==='j')drawJournals();else drawArchive()}
function jPhotos(j){const ph=(j.photos||[]).filter(Boolean);if(ph.length)return ph;
  if(T&&j.trip===T.id)return (T.stops||[]).map(s=>s.photo).filter(Boolean).slice(0,3);
  const tb=((ST&&ST.trails)||[]).find(x=>x.id===j.trip);return tb&&tb.cover?[tb.cover]:[]}
function jList(){return JOURNALS().slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')))}
function drawJournals(){const L=jList(),el=$('jc');
  if(!L.length){el.innerHTML='<div class="gempty" style="width:100%">还没有游记。<br>走完一趟写一篇，<br>或者跟你的 AI 说「帮我把今天写成游记」。</div>';$('jcn').textContent='';return}
  el.innerHTML=L.map(j=>{const w=WHO[j.by]||WHO.her,ph=jPhotos(j),nc=NOTES().filter(n=>j.trip&&n.trip===j.trip).length;
    return '<article class="jcard" data-id="'+esc(j.id)+'"><div class="jimg">'+(ph.length?pic(ph[0]):'<div class="jph"><svg viewBox="0 0 24 24"><use href="#i-paw"/></svg><span>'+esc(j.place||'')+'</span></div>')+'</div>'
      +'<p class="jtx">'+esc(paras(j.text).join(''))+'</p><p class="jby">— '+esc(w.n)+(j.title?' ·《'+esc(j.title)+'》':'')+'</p>'
      +'<div class="jft"><span>'+esc([j.place,mdOf(j.date)].filter(Boolean).join(' · '))+'</span><span>'+(ph.length?'<span>'+ic('image')+ph.length+'</span>':'')+(nc?'<span>'+ic('note')+nc+'</span>':'')+'</span></div></article>'}).join('');
  el.scrollLeft=0;requestAnimationFrame(jcCur)}
function jcCur(){const el=$('jc'),cs=[...el.querySelectorAll('.jcard')];if(!cs.length)return;const mid=el.scrollLeft+el.clientWidth/2;let k=0,bd=1e9;
  cs.forEach((c,i)=>{const d=Math.abs(c.offsetLeft+c.offsetWidth/2-mid);if(d<bd){bd=d;k=i}});cs.forEach((c,i)=>c.classList.toggle('cur',i===k));$('jcn').textContent=(k+1)+' / '+cs.length}
let jcR=0;$('jc').addEventListener('scroll',()=>{cancelAnimationFrame(jcR);jcR=requestAnimationFrame(jcCur)},{passive:true});
$('jc').addEventListener('click',e=>{const c=e.target.closest('.jcard');if(!c)return;if(!c.classList.contains('cur')){c.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});return}openJournal(c.dataset.id)});
function openJournal(id){const j=JOURNALS().find(x=>x.id===id);if(!j)return;const w=WHO[j.by]||WHO.her,ph=jPhotos(j);
  $('jdI').innerHTML=ph.length?'<div class="rail" id="jdR">'+ph.map(pic).join('')+'</div>'+(ph.length>1?'<div class="jdots">'+ph.map((_,k)=>'<i'+(k?'':' class="on"')+'></i>').join('')+'</div>':'')
    :'<div class="jph"><svg viewBox="0 0 24 24"><use href="#i-paw"/></svg><span>'+esc(j.place||'')+'</span></div>';
  $('jdT').textContent=j.title||'无题';$('jdM').textContent=[w.n+'写的',j.place,fullDate(j.date)].filter(Boolean).join(' · ');$('jdX').innerHTML=paras(j.text).map(x=>'<p>'+esc(x)+'</p>').join('');
  const ns=NOTES().filter(n=>j.trip&&n.trip===j.trip).sort((a,b)=>String(a.at).localeCompare(String(b.at)));
  $('jdS').innerHTML=ns.length?'<h3>这一趟的纸条</h3><div class="slips">'+ns.map(n=>slipHtml(n,true)).join('')+'</div>':'';
  const r=$('jdR');if(r)r.addEventListener('scroll',()=>{const k=Math.round(r.scrollLeft/Math.max(1,r.clientWidth));$('jdI').querySelectorAll('.jdots i').forEach((d,x)=>d.classList.toggle('on',x===k))},{passive:true});
  $('jd').classList.add('on');$('jd').scrollTop=0;clampSlips($('jd'))}
function closeJournal(){$('jd').classList.remove('on')}
let JWP=[];
function drawJwp(){$('jwP').innerHTML=JWP.map((u,k)=>'<div class="jwt"><img src="'+esc(u)+'" alt=""><button data-k="'+k+'" aria-label="去掉这张">'+ic('close')+'</button></div>').join('')
  +'<label class="jwa">'+ic('plus')+'<span>加照片</span><input type="file" accept="image/*" multiple hidden id="jwF"></label>';
  $('jwF').onchange=e=>{[...(e.target.files||[])].slice(0,Math.max(0,12-JWP.length)).forEach(f=>JWP.push(URL.createObjectURL(f)));drawJwp()}}
function openWrite(){JWP=[];$('jwT').value='';$('jwX').value='';drawJwp();$('jw').classList.add('on')}
$('jwP').addEventListener('click',e=>{const b=e.target.closest('button[data-k]');if(b){JWP.splice(+b.dataset.k,1);drawJwp()}});
$('jwNo').onclick=()=>$('jw').classList.remove('on');
$('jwOk').onclick=()=>{const tx=$('jwX').value.trim();if(!tx){toast('写几句再保存');return}if(!ST)return;
  const j={id:'j'+Date.now(),by:'her',title:$('jwT').value.trim(),text:tx,photos:JWP.slice(),date:localISO().slice(0,10),place:T?(T.title||''):'',trip:T&&T.id};
  (ST.journals=ST.journals||[]).push(j);$('jw').classList.remove('on');BK='j';drawBook();stickSet($('bkSeg'),'j',false);openJournal(j.id);toast('试玩���只存在这一页，刷新就没了')};
function guideCover(g){for(const d of g.days||[])for(const it of d.items||[])if((it.photos||[])[0])return it.photos[0];return ''}
function archive(){return DEMO.archive||[]}
function drawArchive(){const L=archive(),el=$('ar');if(!L.length){el.innerHTML='<li class="gempty">还没有存下来的线和攻略。</li>';return}
  el.innerHTML=L.map(a=>{const nc=a.trip?NOTES().filter(n=>n.trip===a.trip).length:0,jc=a.trip?JOURNALS().filter(j=>j.trip===a.trip).length:0;
    const meta=[a.stops?a.stops+' 站':'',a.kind==='guide'?(a.days?a.days+' 天攻略':'攻略'):'',jc?jc+' 篇游记':'',nc?nc+' 张纸条':''].filter(Boolean).join(' · ');
    return '<li class="ari" data-id="'+esc(a.id)+'">'+(a.cover?pic(a.cover):'<i class="arph">'+(a.kind==='guide'?ic('book'):ic('paw','f'))+'</i>')
      +'<div><b>'+esc(a.title)+'</b><small>'+esc([a.dates,a.status].filter(Boolean).join(' · '))+'</small>'+(meta?'<small>'+esc(meta)+'</small>':'')+'</div>'+ic('chev')+'</li>'}).join('')}
$('ar').addEventListener('click',e=>{const r=e.target.closest('.ari');if(!r)return;const a=archive().find(x=>x.id===r.dataset.id);if(!a)return;
  if(a.kind==='guide'){GSEL=a.guide;GDAY='all';openGuide();return}
  if(T&&a.trip===T.id){closeBook();setDrawer(false);fit(true);return}
  const j=JOURNALS().find(x=>x.trip===a.trip);if(j)openJournal(j.id);else toast('这一趟只留下了线，没有游记')});
$('bk').onclick=()=>openBook('j');$('bkX').onclick=closeBook;$('bkW').onclick=openWrite;$('jdBack').onclick=closeJournal;
$('bkSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.dataset.k===BK)return;BK=b.dataset.k;stickSet($('bkSeg'),BK,true);drawBook()});

/* ---------- 小工具 ---------- */
function drawHere(){const st=ST||{},t=T,me=st.me,rt=(t&&t.route)||{};
  $('here').innerHTML=me&&me.place?'<i></i>你在 '+esc(me.place)+(me.at?' · '+ago(me.at):''):(t?esc((t.stops||[]).length+' 站 · '+fmtM(rt.distance_m||0)):'')}
let MEM=null;
function drawMeMark(){if(!map)return;const me=ST&&ST.me;if(!me){if(MEM){MEM.remove();MEM=null}return}
  if(MEM)MEM.setLngLat([me.lon,me.lat]);else{const el=document.createElement('div');el.className='mkme';MEM=new maplibregl.Marker({element:el}).setLngLat([me.lon,me.lat]).addTo(map)}}
function pic(u){return '<img alt="" loading="lazy" referrerpolicy="no-referrer" src="'+esc(fixU(u))+'">'}
/* 白天 / 黑夜 */
function setTheme(t){document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('paw-trail-theme',t)}catch(e){}
  $('thm').innerHTML=ic(t==='dark'?'sun':'moon');window.dispatchEvent(new Event('cn-theme'))}
$('thm').innerHTML=ic(isDark()?'sun':'moon');
$('thm').onclick=()=>setTheme(isDark()?'light':'dark');

$('chX').onclick=()=>{document.body.classList.remove('chat','left');chatSlide.reset()};

/* ---------- 开场 ---------- */
initMap();
load().then(()=>{coverReset();const s=Q.get('state'),gq=Q.get('guide');
  if(Q.get('go')==='1'||gq){enter(false);if(gq){GSEL=gq;GDAY='all';setTimeout(openGuide,160)}}
  if(s==='map'||s==='open'||s==='guide'||s==='pop'){enter(false);if(s==='open')setDrawer(true);if(s==='guide'){GDAY=Q.get('day')||'all';openGuide()}if(s==='pop')setTimeout(()=>pick(+(Q.get('i')||0),{fly:false}),900)}
  if(s==='chat')openChat();
  if(s==='book'||s==='archive'||s==='journal'||s==='write'||s==='note'){enter(false);if(s==='note')openNote();else{openBook(s==='archive'?'a':'j');if(s==='journal')setTimeout(()=>{const j=jList()[+(Q.get('j')||0)];j&&openJournal(j.id)},120);if(s==='write')openWrite()}}});
