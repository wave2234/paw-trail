<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;background:#F6EEDF;font-family:"Noto Serif CJK SC","Songti SC",serif;color:#2C2118;position:relative}
.grain{position:absolute;inset:0;opacity:.35;mix-blend-mode:multiply}
.txt{position:absolute;left:84px;top:96px;width:560px}
.lab{font:600 17px/1 "Noto Sans CJK SC",sans-serif;letter-spacing:.32em;color:#BF5A36}
h1{margin-top:30px;font-size:76px;line-height:1.22;font-weight:900;letter-spacing:.02em}
.sub{margin-top:26px;font-size:25px;line-height:1.65;color:#7A6857;font-weight:500}
.slide{margin-top:34px;width:300px;height:58px;border-radius:29px;background:#EFE2CD;border:1px solid rgba(44,33,24,.10);position:relative;font:600 19px/58px "Noto Sans CJK SC",sans-serif;color:#2C2118;text-align:center;letter-spacing:.06em}
.slide .fill{position:absolute;left:0;top:0;bottom:0;width:58px;border-radius:29px;background:rgba(218,119,86,.22)}
.slide .kb{position:absolute;left:5px;top:5px;width:48px;height:48px;border-radius:50%;background:#BF5A36;display:grid;place-items:center;box-shadow:0 6px 14px rgba(160,70,30,.35)}
.slide .kb svg{width:26px;height:26px;fill:#fff}
.slide .ch{position:absolute;right:20px;top:0;color:#A08C7A;font-size:20px;letter-spacing:-.2em}
.sig{position:absolute;right:40px;top:32px;font:500 15px/1 "Noto Serif CJK SC",serif;letter-spacing:.18em;color:#A08C7A}
svg.map{position:absolute;left:0;top:0}
</style></head><body>
<svg class="grain" width="1200" height="630"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .45  0 0 0 0 .35  0 0 0 0 .25  0 0 0 .18 0"/></filter><rect width="1200" height="630" filter="url(#n)"/></svg>
<svg class="map" width="1200" height="630" viewBox="0 0 1200 630">
 <defs><symbol id="paw" viewBox="0 0 24 24"><ellipse cx="5.9" cy="10.4" rx="2" ry="2.6" transform="rotate(-22 5.9 10.4)"/><ellipse cx="9.8" cy="6.5" rx="2" ry="2.7" transform="rotate(-7 9.8 6.5)"/><ellipse cx="14.2" cy="6.5" rx="2" ry="2.7" transform="rotate(7 14.2 6.5)"/><ellipse cx="18.1" cy="10.4" rx="2" ry="2.6" transform="rotate(22 18.1 10.4)"/><path d="M12 11.3c-3 0-5.6 2.7-5.6 5.3 0 1.9 1.5 3 3.1 3 1 0 1.6-.45 2.5-.45s1.5.45 2.5.45c1.6 0 3.1-1.1 3.1-3 0-2.6-2.6-5.3-5.6-5.3z"/></symbol>
 <symbol id="star" viewBox="0 0 24 24"><path d="M12 3.2l2.6 5.5 6 .8-4.4 4.1 1.1 5.9L12 16.6l-5.3 2.9 1.1-5.9L3.4 9.5l6-.8z"/></symbol></defs>
 <path d="M760 70 C900 30 1120 60 1170 170 C1215 270 1120 330 1030 360 C930 392 860 450 900 530 C930 590 1050 600 1210 600 V0 H760z" fill="#D7E5E0" opacity=".85"/>
 <path d="M1000 150 C1060 150 1110 190 1100 240" fill="none" stroke="#B8D0CB" stroke-width="3" stroke-linecap="round"/>
 <g fill="#C9D1AE" opacity=".9"><path d="M700 470 q60 -70 130 -20 q40 -60 100 -10 v100 h-230z"/></g>
 <path id="rt" d="M690 560 C700 470 770 420 840 400 S980 330 970 250 S880 150 960 96 S1090 70 1130 40" fill="none" stroke="#FFFAF2" stroke-width="16" stroke-linecap="round"/>
 <path d="M690 560 C700 470 770 420 840 400 S980 330 970 250 S880 150 960 96 S1090 70 1130 40" fill="none" stroke="#BF5A36" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 14"/>
 <g id="feet"></g>
 <g font-family="Noto Sans CJK SC" font-weight="700" font-size="22" text-anchor="middle">
  <g transform="translate(840 400)"><circle r="23" fill="#DA7756" stroke="#FFFAF2" stroke-width="5"/><text y="8" fill="#fff">1</text></g>
  <g transform="translate(970 250)"><circle r="23" fill="#DA7756" stroke="#FFFAF2" stroke-width="5"/><text y="8" fill="#fff">2</text></g>
  <g transform="translate(960 96)"><circle r="23" fill="#DA7756" stroke="#FFFAF2" stroke-width="5"/><text y="8" fill="#fff">3</text></g>
 </g>
 <use id="bigpaw" href="#paw" x="0" y="0" width="320" height="320" fill="#DA7756" transform="translate(944 352) rotate(-16)"/>
</svg>
<div class="txt">
 <div class="lab">共游 · PAW TRAIL</div>
 <h1>一张地图，<br>两串脚印。</h1>
 <p class="sub">让 AI 找地方、排路线、写好分天攻略，<br>再陪你一起把它走完。</p>
 <div class="slide"><i class="fill"></i>滑动出发<span class="ch">›››</span><i class="kb"><svg viewBox="0 0 24 24"><use href="#paw"/></svg></i></div>
</div>
<div class="sig">wave2234 &amp; Claude</div>
<script>
const p=document.getElementById('rt'),L=p.getTotalLength(),g=document.getElementById('feet'),NS='http://www.w3.org/2000/svg';
for(let d=40,k=0;d<L-30;d+=34,k++){const a=p.getPointAtLength(d),b=p.getPointAtLength(Math.min(L,d+2));const ang=Math.atan2(b.y-a.y,b.x-a.x),deg=ang*180/Math.PI;
  const side=k%2?1:-1,off=17,x=a.x+Math.cos(ang+Math.PI/2)*off*side,y=a.y+Math.sin(ang+Math.PI/2)*off*side;
  const u=document.createElementNS(NS,'use');const him=side>0;u.setAttribute('href',him?'#paw':'#star');u.setAttribute('width',him?17:15);u.setAttribute('height',him?17:15);
  u.setAttribute('x',-8);u.setAttribute('y',-8);u.setAttribute('fill',him?'#8A6E58':'#E0A33C');u.setAttribute('opacity','.85');
  u.setAttribute('transform','translate('+x.toFixed(1)+' '+y.toFixed(1)+') rotate('+(deg+90).toFixed(1)+')');g.appendChild(u)}
</script>
</body></html>
